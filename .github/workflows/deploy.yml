# .github/workflows/deploy.yml
name: Deploy Laravel Backend
on:
  push:
    branches: [ main, 12.x ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Laravel via SSH (مع sudo للـ clone)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            # المسار الصحيح في الـ home
            APP_DIR=/home/ubuntu/laravel-app

            echo "Deploying to $APP_DIR"

            # لو أول مرة → نعمل clone بـ sudo
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First time → cloning with sudo"
              sudo rm -rf $APP_DIR
              sudo mkdir -p $(dirname $APP_DIR)
              sudo chown ubuntu:ubuntu $(dirname $APP_DIR)
              git clone https://github.com/ahmedglala/obilion-task-backend-repo.git $APP_DIR
            else
              echo "Repo exists → pulling latest"
              cd $APP_DIR
              git fetch origin
              git checkout main || git checkout 12.x || true
              git pull
            fi

            cd $APP_DIR

            # تثبيت PHP لو محتاج (بـ sudo)
            sudo apt update -y
            sudo apt install -y php8.3 php8.3-cli php8.3-mysql php8.3-mbstring php8.3-xml php8.3-bcmath php8.3-zip unzip curl git

            # composer + laravel
            composer install --no-dev --optimize-autoloader --no-interaction

            [ -f .env ] || cp .env.example .env
            php artisan key:generate --force

            sed -i "s|DB_HOST=.*|DB_HOST=${{ secrets.RDS_ENDPOINT }}|g" .env
            sed -i "s|DB_DATABASE=.*|DB_DATABASE=appdb|g" .env
            sed -i "s|DB_USERNAME=.*|DB_USERNAME=admin|g" .env
            sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|g" .env

            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache

            # تشغيل Laravel
            pkill -f "php artisan serve" || true
            nohup php artisan serve --host=0.0.0.0 --port=8000 > /tmp/laravel.log 2>&1 &

            echo "Laravel deployed successfully!"
            echo "Open: http://$(curl -s ifconfig.me):8000"