# .github/workflows/deploy.yml
name: Deploy Laravel Backend

on:
  push:
    branches: [main, 12.x]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Laravel (نسخة نهائية)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR=/home/ubuntu/laravel-app
            RDS_HOST=${{ secrets.RDS_ENDPOINT }}
            DB_NAME=appdb
            DB_USER=admin
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_PORT=8000

            # ===== تنظيف ونسخ الكود =====
            rm -rf $APP_DIR && mkdir -p $APP_DIR
            git clone https://github.com/ahmedglala/obilion-task-backend-repo.git $APP_DIR || (cd $APP_DIR && git pull)
            cd $APP_DIR

            # ===== تثبيت PHP والاعتماديات =====
            sudo apt update -y
            sudo apt install -y ca-certificates software-properties-common netcat-openbsd unzip curl git
            sudo add-apt-repository ppa:ondrej/php -y
            sudo apt update -y
            sudo apt install -y php8.3 php8.3-cli php8.3-mysql php8.3-mbstring php8.3-xml php8.3-bcmath php8.3-zip composer

            # ===== Composer Dependencies =====
            composer install --no-dev --optimize-autoloader --no-interaction

            # ===== إعداد ملف البيئة =====
            [ -f .env ] || cp .env.example .env
            php artisan key:generate --force

            sed -i "s|#\?DB_CONNECTION=.*|DB_CONNECTION=mysql|g" .env
            sed -i "s|#\?DB_HOST=.*|DB_HOST=$RDS_HOST|g" .env
            sed -i "s|#\?DB_DATABASE=.*|DB_DATABASE=$DB_NAME|g" .env
            sed -i "s|#\?DB_USERNAME=.*|DB_USERNAME=$DB_USER|g" .env
            sed -i "s|#\?DB_PASSWORD=.*|DB_PASSWORD=$DB_PASSWORD|g" .env
            sed -i "s|#\?SESSION_DRIVER=.*|SESSION_DRIVER=database|g" .env || echo "SESSION_DRIVER=database" >> .env


            # ===== إنشاء جدول sessions لو مش موجود =====
            php artisan session:table 2>/dev/null || true

            # ===== تنفيذ Migrations =====
            php artisan migrate --force

            # ===== تنظيف الكاش =====
            php artisan config:cache
            php artisan route:cache
            php artisan cache:clear

            # ===== تشغيل Laravel على كل الواجهات =====
            pkill -f "php artisan serve" || true
            nohup php artisan serve --host=0.0.0.0 --port=$APP_PORT > /tmp/laravel.log 2>&1 &

            echo "Laravel شغال على http://$(curl -s ifconfig.me):$APP_PORT"
            echo "Logs: /tmp/laravel.log"
