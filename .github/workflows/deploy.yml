name: Laravel Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RDS_HOST: ${{ secrets.RDS_ENDPOINT }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: appdb      # نكتبها صراحة
      DB_USER: admin      # نكتبها صراحة
      APP_PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, tokenizer, xml
          ini-values: post_max_size=256M, max_execution_time=300
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup .env
        run: |
          touch .env
          # إزالة أي سطر موجود لكل متغير
          sed -i "/DB_CONNECTION/d" .env
          sed -i "/DB_HOST/d" .env
          sed -i "/DB_DATABASE/d" .env
          sed -i "/DB_USERNAME/d" .env
          sed -i "/DB_PASSWORD/d" .env
          sed -i "/SESSION_DRIVER/d" .env
          # إضافة القيم الجديدة
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=$RDS_HOST" >> .env
          echo "DB_DATABASE=$DB_NAME" >> .env
          echo "DB_USERNAME=$DB_USER" >> .env
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env
          echo "SESSION_DRIVER=database" >> .env

      - name: Cache clear
        run: php artisan config:clear && php artisan cache:clear && php artisan route:clear

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Start Laravel Server
        run: nohup php artisan serve --host=0.0.0.0 --port=$APP_PORT &
