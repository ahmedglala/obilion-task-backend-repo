# .github/workflows/deploy.yml
name: Deploy Laravel Backend
on:
  push:
    branches: [ 12.x, main ]   # خليناها تشتغل على main و 12.x
  workflow_dispatch:         # تقدر تشغلها يدوي من GitHub لو عايز

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Laravel via SSH (Fully Automated)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR=/laravel-app
            cd $APP_DIR || mkdir -p $APP_DIR && cd $APP_DIR

            # 1. Clone or pull (يدعم main أو 12.x)
            if [ ! -d ".git" ]; then
              echo "First time → cloning repo"
              rm -rf $APP_DIR
              git clone https://github.com/ahmedglala/obilion-task-backend-repo.git $APP_DIR
              cd $APP_DIR
              echo "in the directory"
            else
              echo "Repo exists → pulling latest"
              git fetch origin
              git checkout 12.x || git checkout main || true
              git pull origin 12.x || git pull origin main || true
            fi

            # 2. Install PHP extensions first (قبل أي composer)
            sudo apt update -y
            sudo apt install -y php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-bcmath php8.3-zip

            # 3. Composer install
            composer install --no-dev --optimize-autoloader --no-interaction

            # 4. .env setup – نعدل الـ DB قبل أي artisan command
            [ -f .env ] || cp .env.example .env
            php artisan key:generate --force 2>/dev/null || true

            sed -i "s|DB_HOST=.*|DB_HOST=${{ secrets.RDS_ENDPOINT }}|g" .env
            sed -i "s|DB_DATABASE=.*|DB_DATABASE=appdb|g" .env
            sed -i "s|DB_USERNAME=.*|DB_USERNAME=admin|g" .env
            sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|g" .env
            sed -i "s|SESSION_DRIVER=.*|SESSION_DRIVER=database|g" .env || echo "SESSION_DRIVER=database" >> .env
            sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=mysql|g" .env || echo "DB_CONNECTION=mysql" >> .env

            # 5. Session table + migrate (safe)
            php artisan session:table 2>/dev/null || true
            php artisan migrate --force

            # 6. Cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 7. Restart Laravel
            sudo systemctl restart laravel.service 2>/dev/null || true
            pkill -f "php artisan serve" || true
            nohup php artisan serve --host=0.0.0.0 --port=8000 > /tmp/laravel.log 2>&1 &

            echo "Laravel deployed successfully on port 8000"